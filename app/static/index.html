<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#07c160">
  <title>企微运维中枢</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div id="app" class="app">
    <!-- 顶栏 -->
    <header class="topbar" id="topbar" hidden>
      <div class="topbar-brand">
        <span class="topbar-logo">🔧</span>
        <span class="topbar-title">企微运维中枢</span>
      </div>
      <nav class="topbar-nav" id="nav">
        <a href="#/status" class="nav-link" data-route="status">概览</a>
        <a href="#/targets" class="nav-link" data-route="targets">探针</a>
        <a href="#/settings" class="nav-link" data-route="settings">设置</a>
        <a href="#/menu" class="nav-link" data-route="menu">菜单</a>
        <a href="#/alerts" class="nav-link" data-route="alerts">告警</a>
      </nav>
      <button class="topbar-logout" id="btnLogout" title="退出登录">退出</button>
    </header>

    <!-- 主内容 -->
    <main class="main" id="main">
      <!-- 路由挂载点 -->
      <div id="view"></div>
    </main>

    <!-- 全局提示条 -->
    <div class="toast" id="toast" hidden></div>
  </div>

  <!-- 登录页 -->
  <div class="login-page" id="loginPage">
    <div class="login-card">
      <div class="login-logo">🔧</div>
      <h1 class="login-title">企微运维中枢</h1>
      <p class="login-sub">请输入管理密码登录</p>
      <form id="loginForm" class="login-form">
        <input type="password" id="loginPassword" class="login-input" placeholder="管理密码" autocomplete="current-password" autofocus>
        <button type="submit" class="btn btn-primary btn-block" id="loginBtn">登录</button>
        <div class="login-error" id="loginError" hidden></div>
      </form>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
